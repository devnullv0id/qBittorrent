<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(RSS Feed Options)QBT_TR[CONTEXT=RSSFeedDialog]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        event.preventDefault();
                        document.getElementById("submitButton").click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const searchParams = new URLSearchParams(window.location.search);
            const currentUrl = searchParams.get("url");
            const currentRefreshInterval = Math.max(Number(searchParams.get("refreshInterval")), 0);

            document.getElementById("refreshInterval").value = currentRefreshInterval;
            document.getElementById("url").value = currentUrl;
            document.getElementById("url").focus();
            document.getElementById("url").setSelectionRange(0, currentUrl.length);

            document.getElementById("submitButton").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();

                // check field
                const newUrl = document.getElementById("url").value.trim();
                if (newUrl === "") {
                    alert("QBT_TR(URL cannot be empty)QBT_TR[CONTEXT=RSSWidget]");
                    return;
                }

                const newRefreshInterval = Math.max(Number(document.getElementById("refreshInterval").value), 0);
                const urlChanged = (newUrl !== currentUrl);
                const refreshIntervalChanged = (newRefreshInterval !== currentRefreshInterval);

                if (!urlChanged && !refreshIntervalChanged) {
                    alert("QBT_TR(Feed options are unchanged)QBT_TR[CONTEXT=RSSFeedDialog]");
                    return;
                }

                document.getElementById("submitButton").disabled = true;

                const path = searchParams.get("path");
                const post = (endpoint, body) => fetch(`api/v2/rss/${endpoint}`, {
                    method: "POST",
                    body: new URLSearchParams(body)
                });

                // one at a time, in the order the GUI applies them: a failure must not leave the
                // other change applied behind a failure message
                (async () => {
                    if (refreshIntervalChanged) {
                        const response = await post("setFeedRefreshInterval", { path: path, refreshInterval: newRefreshInterval });
                        if (!response.ok)
                            return await response.text();
                    }
                    if (urlChanged) {
                        const response = await post("setFeedURL", { path: path, url: newUrl });
                        if (!response.ok)
                            return await response.text();
                    }
                    return null;
                })()
                .then((error) => {
                        if (error !== null) {
                            alert(error || "QBT_TR(Unable to update feed options)QBT_TR[CONTEXT=RSSFeedDialog]");
                            document.getElementById("submitButton").disabled = false;
                            return;
                        }

                        window.parent.qBittorrent.Rss.updateRssFeedList(true);
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    })
                    .catch(() => {
                        alert("QBT_TR(Unable to update feed options)QBT_TR[CONTEXT=RSSFeedDialog]");
                        document.getElementById("submitButton").disabled = false;
                    });
            });
        });
    </script>
</head>

<body>
    <div style="padding: 10px 10px 0px 10px;">
        <label for="url" style="font-weight: bold;">QBT_TR(Feed URL:)QBT_TR[CONTEXT=RSSWidget]</label>
        <input type="text" id="url" style="width: 320px;">
        <div style="display: flex; align-items: center; padding-top: 10px;">
            <label for="refreshInterval">QBT_TR(Refresh interval:)QBT_TR[CONTEXT=RSSFeedDialog]</label>
            <input type="number" id="refreshInterval" value="0" step="1" min="0" style="width: 8em; margin-left: 10px;">
            <span style="margin-left: 5px;">QBT_TR(sec)QBT_TR[CONTEXT=OptionsDialog] <i>QBT_TR(0 = use the global interval)QBT_TR[CONTEXT=RSSFeedDialog]</i></span>
        </div>
        <div style="text-align: center; padding-top: 10px;">
            <input type="button" value="QBT_TR(Save)QBT_TR[CONTEXT=HttpServer]" id="submitButton">
        </div>
    </div>
</body>

</html>
