<script>
    "use strict";

    window.qBittorrent ??= {};
    window.qBittorrent.GlobalSpeedLimits ??= (() => {
        const exports = () => {
            return {
                init: init,
            };
        };

        const setupSlider = (sliderId, input, limit) => {
            const update = (value) => {
                input.value = (value === 0) ? "∞" : value;
            };

            input.addEventListener("change", (e) => {
                let value = Number(e.target.value);
                if (Number.isNaN(value) || (value < 0))
                    value = 0;

                slider.value = value;
                update(value);
            });

            const slider = document.getElementById(sliderId);
            if (limit > slider.max)
                slider.max = limit;
            slider.value = limit;
            slider.addEventListener("input", (e) => {
                update(Number(e.target.value));
            });

            update(limit);
            window.qBittorrent.SpeedSlider.upgrade(slider, input);
        };

        // the limit the torrents share, else none (a field Apply leaves alone while it stays at none)
        const loadTorrentLimits = (hashes, uploadValue, downloadValue) => {
            const limitOf = (method, input) => fetch(`api/v2/torrents/${method}`, {
                    method: "POST",
                    body: new URLSearchParams({
                        hashes: hashes
                    })
                })
                .then(async (response) => {
                    const limits = Object.values(await response.json());
                    input.dataset.mixed = limits.some((limit) => limit !== limits[0]).toString();
                    return (input.dataset.mixed === "false") ? Math.max(limits[0], 0) : 0;
                });

            Promise.all([limitOf("uploadLimit", uploadValue), limitOf("downloadLimit", downloadValue)])
                .then(([upload, download]) => {
                    setupSlider("uploadSlider", uploadValue, (upload / 1024));
                    setupSlider("downloadSlider", downloadValue, (download / 1024));
                })
                .catch(console.error);
        };

        const init = () => {
            const uploadValue = document.getElementById("uploadValue");
            const downloadValue = document.getElementById("downloadValue");
            const altUploadValue = document.getElementById("altUploadValue");
            const altDownloadValue = document.getElementById("altDownloadValue");

            const applyButton = document.getElementById("applyButton");
            // Modern opens it for torrents too: their limits, without the alternative ones
            const hashes = window.MUI.Windows.instances[applyButton.closest(".mocha")?.id]?.options.data?.hashes?.join("|");
            if (hashes !== undefined)
                altUploadValue.closest("fieldset").classList.add("invisible");

            // close the page's window, if it is in one (not Modern's popup)
            const applied = (ok) => {
                if (!ok)
                    alert("QBT_TR(Failed to set speed limits)QBT_TR[CONTEXT=SpeedLimit]");

                window.parent.updateMainData();
                const pageWindow = applyButton.closest(".mocha");
                if (pageWindow !== null)
                    window.parent.qBittorrent.Client.closeWindow(pageWindow);
            };

            applyButton.addEventListener("click", (_event) => {
                const upload = window.qBittorrent.SpeedSlider.readKiB(uploadValue) * 1024 || 0;
                const download = window.qBittorrent.SpeedSlider.readKiB(downloadValue) * 1024 || 0;

                if (hashes !== undefined) {
                    const setLimit = (method, limit) => fetch(`api/v2/torrents/${method}`, {
                        method: "POST",
                        body: new URLSearchParams({
                            hashes: hashes,
                            limit: limit
                        })
                    });
                    const requests = [];
                    if ((uploadValue.dataset.mixed !== "true") || (upload !== 0))
                        requests.push(setLimit("setUploadLimit", upload));
                    if ((downloadValue.dataset.mixed !== "true") || (download !== 0))
                        requests.push(setLimit("setDownloadLimit", download));
                    Promise.all(requests)
                        .then((responses) => applied(responses.every((response) => response.ok)))
                        .catch(console.error);
                    return;
                }

                const altUpload = window.qBittorrent.SpeedSlider.readKiB(altUploadValue) * 1024 || 0;
                const altDownload = window.qBittorrent.SpeedSlider.readKiB(altDownloadValue) * 1024 || 0;

                fetch("api/v2/transfer/setSpeedLimits", {
                    method: "POST",
                    body: new URLSearchParams({
                        up_limit: upload,
                        dl_limit: download,
                        alt_up_limit: altUpload,
                        alt_dl_limit: altDownload,
                    })
                }).then((response) => applied(response.ok));
            });

            if (hashes !== undefined) {
                loadTorrentLimits(hashes, uploadValue, downloadValue);
                return;
            }

            fetch("api/v2/transfer/getSpeedLimits", {
                    method: "GET",
                    cache: "no-store"
                })
                .then(async (response) => {
                    const limits = await response.json();
                    setupSlider("uploadSlider", uploadValue, (limits.up_limit / 1024));
                    setupSlider("downloadSlider", downloadValue, (limits.dl_limit / 1024));
                    setupSlider("altUploadSlider", altUploadValue, (limits.alt_up_limit / 1024));
                    setupSlider("altDownloadSlider", altDownloadValue, (limits.alt_dl_limit / 1024));
                });
        };

        return exports();
    })();
    Object.freeze(window.qBittorrent.GlobalSpeedLimits);

    window.qBittorrent.GlobalSpeedLimits.init();
</script>
